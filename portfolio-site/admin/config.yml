backend:
  name: github
  repo: YOUR-USERNAME/YOUR-USERNAME.github.io   # EDIT: your GitHub username, twice
  branch: main
  # base_url: https://YOUR-WORKER.workers.dev    # only if you later add the optional OAuth proxy

site_url: https://YOUR-USERNAME.github.io        # EDIT
display_url: https://YOUR-USERNAME.github.io     # EDIT
media_folder: assets/uploads
public_folder: /assets/uploads

collections:
  - name: portfolio
    label: Portfolio
    files:
      - name: settings
        label: Theme, layout and section order
        file: content/settings.json
        fields:
          - {name: site_title, label: Browser tab title, widget: string}
          - {name: description, label: Search engine description, widget: text}
          - name: theme
            label: Colors
            widget: object
            fields:
              - {name: bg, label: Page background, widget: color, default: "#0b1426"}
              - {name: surface, label: Card background, widget: color, default: "#13213b"}
              - {name: text, label: Main text, widget: color, default: "#f2efe8"}
              - {name: muted, label: Secondary text, widget: color, default: "#a9b4c8"}
              - {name: accent, label: Accent (links, buttons), widget: color, default: "#7fc4c9"}
          - name: fonts
            label: Typography
            widget: object
            fields:
              - {name: heading, label: Heading font, widget: select, default: Fraunces, options: [Fraunces, Playfair Display, Lora, Source Serif 4, Space Grotesk, Manrope, Inter]}
              - {name: body, label: Body font, widget: select, default: Inter, options: [Inter, DM Sans, Manrope, Lora, Source Serif 4]}
          - {name: radius, label: Corner roundness (0 to 32), widget: number, value_type: int, min: 0, max: 32, default: 14}
          - {name: hero_layout, label: Homepage layout, widget: select, options: [split, centered], default: split}
          - name: sections
            label: Sections (drag to reorder, switch off to hide)
            widget: list
            fields:
              - {name: id, label: Section, widget: select, options: [about, research, content, projects, skills, leadership, contact]}
              - {name: title, label: Heading shown on site, widget: string}
              - {name: visible, label: Show this section, widget: boolean, default: true}
              - {name: layout, label: Card layout, widget: select, options: [grid, list], default: grid}

      - name: profile
        label: Homepage, About and Contact
        file: content/profile.json
        fields:
          - {name: name, label: Full name, widget: string}
          - {name: role, label: Role line, widget: string}
          - {name: tagline, label: Short intro, widget: text}
          - {name: portrait, label: Portrait photo, widget: image, required: false}
          - {name: portrait_alt, label: Portrait description (for screen readers), widget: string, required: false}
          - {name: cta_label, label: Main button text, widget: string, required: false}
          - {name: cta_url, label: Main button link, widget: string, required: false}
          - {name: about, label: Biography (blank line = new paragraph), widget: text}
          - {name: highlights, label: Highlight tags, widget: list, required: false, field: {name: item, label: Tag, widget: string}}
          - {name: contact_text, label: Contact message, widget: text, required: false}
          - {name: email, label: Public email, widget: string, required: false}
          - {name: location, label: Location, widget: string, required: false}
          - name: socials
            label: Social links (empty links are hidden)
            widget: list
            required: false
            fields:
              - {name: label, label: Name, widget: string}
              - {name: url, label: Link, widget: string, required: false}

      - name: research
        label: Academic and Research
        file: content/research.json
        fields:
          - {name: intro, label: Introduction, widget: text, required: false}
          - {name: interests, label: Research interests, widget: list, required: false, field: {name: item, label: Interest, widget: string}}
          - name: items
            label: Papers, theses, assignments
            widget: list
            required: false
            fields:
              - {name: title, label: Title, widget: string}
              - {name: kind, label: Type (for example Thesis), widget: string, required: false}
              - {name: summary, label: Summary, widget: text, required: false}
              - {name: link, label: Link, widget: string, required: false}

      - name: creative
        label: Content Creation
        file: content/creative.json
        fields:
          - {name: intro, label: Introduction, widget: text, required: false}
          - name: videos
            label: Videos (YouTube links)
            widget: list
            required: false
            fields:
              - {name: title, label: Title, widget: string}
              - {name: url, label: YouTube or other link, widget: string}
              - {name: description, label: Description, widget: text, required: false}
          - name: photos
            label: Photography
            widget: list
            required: false
            fields:
              - {name: image, label: Photo, widget: image}
              - {name: alt, label: Description (for screen readers), widget: string}
              - {name: caption, label: Caption, widget: string, required: false}

      - name: projects
        label: Projects
        file: content/projects.json
        fields:
          - {name: intro, label: Introduction, widget: text, required: false}
          - name: items
            label: Projects
            widget: list
            required: false
            fields:
              - {name: title, label: Title, widget: string}
              - {name: summary, label: Summary, widget: text}
              - {name: image, label: Image, widget: image, required: false}
              - {name: alt, label: Image description, widget: string, required: false}
              - {name: tags, label: Tags, widget: list, required: false, field: {name: item, label: Tag, widget: string}}
              - {name: link, label: Link, widget: string, required: false}
              - {name: featured, label: Show first as featured, widget: boolean, default: false}

      - name: skills
        label: Skills
        file: content/skills.json
        fields:
          - name: groups
            label: Skill groups
            widget: list
            fields:
              - {name: name, label: Group name, widget: string}
              - {name: items, label: Skills, widget: list, field: {name: item, label: Skill, widget: string}}

      - name: leadership
        label: Leadership and Activities
        file: content/leadership.json
        fields:
          - name: items
            label: Roles and activities
            widget: list
            fields:
              - {name: role, label: Role, widget: string}
              - {name: organization, label: Organization, widget: string}
              - {name: summary, label: Description, widget: text, required: false}
              - {name: link, label: Link, widget: string, required: false}
